[project]
name = "paperclip-workflow-controller"
version = "0.1.0"
description = "Deterministic artifact gates for Paperclip autonomous workflows."
requires-python = ">=3.11"
dependencies = ["mcp>=1.0,<2.0", "pydantic>=2.0,<3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
